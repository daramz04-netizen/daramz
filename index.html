<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찬양 곡 노트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f5f3;--card:#fff;--ink:#1c1d1f;--sub:#7a7d82;--line:#e8e8e5;--acc:#1c1d1f;--accInk:#fff;--chip:#efefec;--ind:#3b3bb0;--indBg:#ecedfb;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1e2022;--ink:#eeeeec;--sub:#9a9ea4;--line:#2d3033;--acc:#eeeeec;--accInk:#141516;--chip:#2a2c2f;--ind:#a9abf5;--indBg:#2a2b49;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--card:#1e2022;--ink:#eeeeec;--sub:#9a9ea4;--line:#2d3033;--acc:#eeeeec;--accInk:#141516;--chip:#2a2c2f;--ind:#a9abf5;--indBg:#2a2b49;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:680px;margin:0 auto;padding:18px 16px 150px}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 16px}
.hd h1{font-size:1.7rem;margin:0;letter-spacing:-.03em}
.sub{color:var(--sub);font-size:.9rem}
.ic{width:22px;height:22px;flex:none}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 16px;margin-bottom:12px;color:var(--sub)}
.search input{flex:1;border:0;background:none;outline:none;padding:15px 0;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:600}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.chip.dash{border-style:dashed;color:var(--ind);background:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.kb{flex:none;width:58px;height:58px;border-radius:16px;background:var(--indBg);color:var(--ind);font-weight:800;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.kb.sm{width:46px;height:46px;font-size:1rem;border-radius:13px}
.rm{flex:1;min-width:0}
.rt{font-weight:700;font-size:1.08rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl{color:var(--sub);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri{flex:none;display:flex;align-items:center;gap:4px;color:var(--sub)}
.ri .ic{width:20px;height:20px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.empty2{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px;gap:6px}
.empty2 .eic{width:84px;height:84px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty2 h3{margin:0;font-size:1.15rem}.empty2 p{margin:0 0 16px;color:var(--sub)}
.btn{background:var(--acc);color:var(--accInk);border:1px solid var(--acc);border-radius:14px;padding:12px 22px;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:11px}
.btn.full{width:100%}
.btn.danger{color:var(--red)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accInk);border:0;border-radius:999px;padding:16px 24px;font-weight:700;font-size:1.02rem;display:none;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:30}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:.8rem;font-weight:600}
.tabs button.on{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:.92rem;color:var(--sub);font-weight:600}
.card .big{font-size:1.2rem;font-weight:800;margin-bottom:6px}
.card p{margin:6px 0 10px}
label{display:block;font-weight:700;margin:14px 0 6px}
label i{color:#c0392b;font-style:normal}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;margin-bottom:8px}
textarea.fld{resize:vertical;min-height:110px}
.fld:focus{border-color:var(--sub)}
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kgrid button{padding:13px 0;border:1px solid var(--line);background:var(--card);border-radius:14px;font-weight:700}
.kgrid button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:.78rem;padding:3px 10px;border-radius:999px;color:#2b2b2b;font-weight:600}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative}
.thumbs img{height:84px;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs b{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:.8rem;cursor:pointer}
.page{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
.page.show{display:flex}
.ph{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;flex:none}
.ph h2{margin:0;font-size:1.1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk{border:0;background:none;padding:8px;display:flex}
.pb{flex:1;overflow-y:auto;padding:8px 16px 24px;max-width:680px;width:100%;margin:0 auto}
.pf{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}
.pf .btn{flex:1}
.pf .btn:last-child{flex:1.4}
.vbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.vimgs img{width:100%;border-radius:12px;margin-bottom:10px;background:#fff;border:1px solid var(--line)}
.vi{display:flex;gap:12px;align-items:center}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.sc img{width:100%;height:140px;object-fit:cover;object-position:top;border-radius:9px;background:#fff;border:1px solid var(--line);display:block}
.st{font-weight:700;font-size:.88rem;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kh{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow small{color:var(--sub);display:block}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.on>.num,.crow .num{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.mv{display:flex;gap:4px}
.mv button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px}
.sfb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sfb input{width:90px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--card)}
.sfprev{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.sfprev canvas{width:100%;display:block}
#gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
.gt{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:10px}
.gt .gi{font-size:2.6rem}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:10px 18px;border-radius:12px;display:none;z-index:200;font-size:.92rem;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="hd"><h1 id="tName">찬양 곡 노트</h1><span class="sub" id="hCount"></span></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab"></button>
<nav class="tabs" id="tabs"></nav>

<div class="page" id="pgSong"><div class="ph"><button class="bk" data-close="pgSong" id="bkSong"></button><h2 id="psT">곡 등록</h2></div>
 <div class="pb">
  <div class="card"><h3>기본 정보</h3>
   <label style="margin-top:0">곡 제목 <i>*</i></label><input class="fld" id="fTitle" placeholder="곡 제목">
   <label>가사 한 줄</label><input class="fld" id="fLyric" maxlength="80" placeholder="목록에서 곡을 알아볼 대표 가사">
   <label>음원 유튜브 링크</label><input class="fld" id="fYt" placeholder="https://youtu.be/…">
   <label>원키</label><div id="kpSong"></div>
   <label>분류</label><div class="pick" id="fCats"></div>
   <div id="newCat" style="display:none;margin-top:10px;gap:8px"><input class="fld" id="ncName" maxlength="8" placeholder="새 분류 이름" style="margin:0;flex:1"><button class="btn sm" id="ncAdd">추가</button></div>
  </div>
  <div class="card"><h3>악보</h3>
   <label class="btn ghost sm" style="display:inline-block;margin:0">＋ 악보 이미지 추가<input type="file" id="fFile" accept="image/*" multiple hidden></label>
   <div class="thumbs" id="fThumbs"></div>
  </div>
 </div>
 <div class="pf"><button class="btn ghost" data-close="pgSong">취소</button><button class="btn" id="sgSave">저장</button></div>
</div>

<div class="page" id="pgSheet"><div class="ph"><button class="bk" data-close="pgSheet" id="bkSheet"></button><h2>악보 추가</h2></div>
 <div class="pb">
  <div class="card">
   <label style="margin-top:0">곡 제목 (선택)</label><input class="fld" id="shTitle" list="songList" maxlength="40" placeholder="예) 주 은혜임을"><datalist id="songList"></datalist>
   <label>키</label><div id="kpSheet"></div>
   <label>악보 이미지</label>
   <label class="btn ghost sm" style="display:inline-block;margin:0">＋ 이미지 추가<input type="file" id="shFile" accept="image/*" multiple hidden></label>
   <div class="thumbs" id="shThumbs"></div>
  </div>
 </div>
 <div class="pf"><button class="btn ghost" data-close="pgSheet">취소</button><button class="btn" id="shSave">보관함에 저장</button></div>
</div>

<div class="page" id="pgConti"><div class="ph"><button class="bk" data-close="pgConti" id="bkConti"></button><h2>새 콘티</h2></div>
 <div class="pb">
  <div class="card">
   <label style="margin-top:0">콘티 이름</label><input class="fld" id="cnName" maxlength="40" placeholder="주일 2부 예배">
   <label>날짜</label><input class="fld" id="cnDate" type="date">
   <label>말씀 · 주제</label><textarea class="fld" id="cnTopic" placeholder="본문과 설교 주제"></textarea>
  </div>
  <div class="card"><h3 id="cnCount">선택한 곡</h3><div id="cnList"></div>
   <button class="btn ghost full" id="cnAdd" style="margin-top:8px;color:var(--ind)">＋ 곡 추가</button>
  </div>
 </div>
 <div class="pf"><button class="btn" id="cnPdf">PDF 만들기</button></div>
</div>

<div class="page" id="pgPick"><div class="ph"><button class="bk" data-close="pgPick" id="bkPick"></button><h2>곡 선택</h2><button class="btn sm" id="pkDone">완료</button></div>
 <div class="pb">
  <div class="seg"><button data-pt="s" id="pkS">곡</button><button data-pt="h" id="pkH">악보 보관함</button></div>
  <div class="search" id="pkSearchBox"><span id="pkIc"></span><input type="text" id="pkQ" placeholder="검색"></div>
  <div id="pkList"></div>
 </div>
</div>

<div class="page" id="pgView"><div class="ph"><button class="bk" data-close="pgView" id="bkView"></button><h2 id="vT"></h2></div>
 <div class="pb" id="vB"></div>
</div>

<div class="page" id="pgSf"><div class="ph"><button class="bk" data-close="pgSf" id="bkSf"></button><h2>송폼 쓰기</h2></div>
 <div class="pb">
  <div class="chips" id="sfPg"></div>
  <div class="sfb" id="sfSec"></div>
  <div class="sfb" id="sfMeas"></div>
  <div class="sfb"><input type="number" id="sfN" min="1" max="128" placeholder="마디 수"><button class="btn ghost sm" id="sfNAdd">마디추가</button><button class="btn ghost sm" id="sfBack">⌫ 마지막 삭제</button><button class="btn ghost sm" id="sfClr">전체 지우기</button></div>
  <textarea class="fld" id="sfText" rows="2" style="min-height:70px" placeholder="버튼을 누르면 송폼이 만들어져요. 직접 고쳐 써도 돼요 (예: Intro (4마디) V C (8마디))"></textarea>
  <div class="sfprev"><canvas id="sfCv" width="10" height="10"></canvas></div>
 </div>
 <div class="pf"><button class="btn ghost" id="sfDl">⬇ 기기에 저장</button><button class="btn" id="sfSave">악보 보관함에 저장</button></div>
</div>

<div id="gate"></div>
<div id="toast"></div>

<script>
var SUPABASE_URL = 'https://pkdwbavvqrunhfwdxrwa.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_hIw1vREA2adHmh8pjZrJVQ_8oc9rRQe';
var OWNER_EMAIL = 'daramz04@gmail.com';

var $=function(i){return document.getElementById(i)};
var db=null,user=null,assets=null,downloads=null,myId=null,myEmail='',isOwner=false,ready=false,needCfg=false;
var songs=[],sheets=[],contis=[],members={},requests={},myReq=null,names={},teamName='찬양 곡 노트';
var CV={'--c1':'#f3d98b','--c2':'#f1b9a4','--c3':'#bcd9a3','--c4':'#f0b4c6','--c5':'#a9cce6','--c6':'#a9dccf','--c7':'#cdbdea'};
var CATS=[{n:'찬송',c:'#f3d98b'},{n:'고백',c:'#f1b9a4'},{n:'감사',c:'#bcd9a3'},{n:'사랑',c:'#f0b4c6'},{n:'공동체',c:'#a9cce6'},{n:'동행',c:'#a9dccf'},{n:'믿음',c:'#cdbdea'}];
var PAL=['#f0c9a4','#d3e0a1','#e8bde0','#b5d3ee','#efe08a','#b9e3c8','#e6c0c0','#c5cdf0'];
var KEYS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'],ALLKEYS=KEYS.concat(KEYS.map(function(k){return k+'m'}));
var tab='songs',sub='list',q='',fKey='',fCat='',shKey='',cmArm=null,vArm=false;

function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:''}
function canWrite(){return !!db&&(isOwner||!!members[myId])}
function nm(id){return names[id]||'계정 확인됨'}
function catColor(n){var c=CATS.filter(function(x){return x.n===n})[0];if(!c)return 'var(--line)';return CV[c.c]||c.c}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dstr(v){var d=typeof v==='number'?new Date(v):new Date(v+'T00:00:00');return isNaN(d)?'':d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'}
var ICO={music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',list:'<path d="M10 6h11M10 12h11M10 18h11M3 6h2M3 12h2M3 18h2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c3 0 5 2 5 5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[n]+'</svg>'}
function chip(v,l,on,g){return '<button class="chip'+(on?' on':'')+'" data-g="'+g+'" data-v="'+esc(v)+'">'+esc(l)+'</button>'}

/* ---------- 화면 ---------- */
function render(){
  var g=$('gate');
  if(needCfg||(ready&&!db)){
    if(g.getAttribute('data-on')!=='1'){g.innerHTML=gateHTML();gateBind();g.setAttribute('data-on','1')}
    g.style.display='flex';return}
  g.style.display='none';
  $('tName').textContent=teamName;document.title=teamName;
  $('tabs').innerHTML=[['songs','music','곡'],['conti','list','콘티'],['team','users','팀']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+ic(t[1])+'<span>'+t[2]+'</span></button>'}).join('');
  var fab=$('fab'),w=canWrite(),lab='';
  if(tab==='songs'&&w)lab=sub==='list'?'곡 등록':'악보 추가';
  if(tab==='conti')lab='콘티 만들기';
  fab.style.display=lab?'flex':'none';fab.innerHTML=ic('plus')+'<span>'+lab+'</span>';
  $('hCount').textContent=tab==='songs'?(sub==='list'?songs.length+'곡':sheets.length+'장'):tab==='conti'?contis.length+'개':'';
  var el=document.activeElement;
  if(tab==='songs'&&sub==='list'&&el&&el.id==='q'){updSongs();return}
  if(el&&/INPUT|TEXTAREA/.test(el.tagName)&&$('main').contains(el))return;
  $('main').innerHTML=tab==='songs'?vSongs():tab==='conti'?vConti():vTeam();
  if(tab==='songs'){if(sub==='list')updSongs();else updSheets()}
}
function vSongs(){
  var seg='<div class="seg"><button data-sub="list" class="'+(sub==='list'?'on':'')+'">곡 목록</button><button data-sub="sheets" class="'+(sub==='sheets'?'on':'')+'">악보 보관함</button></div>';
  if(sub==='sheets')return seg+'<div class="chips" id="shChips"></div><div id="shList"></div>';
  return seg+'<div class="search">'+ic('search')+'<input type="text" id="q" placeholder="제목이나 가사로 검색" value="'+esc(q)+'"></div><div class="chips" id="kChips"></div><div class="chips" id="cChips"></div><div id="sList"></div>';
}
function updSongs(){
  var ks={};songs.forEach(function(s){ks[s.key]=1});
  $('kChips').innerHTML=chip('','전체',fKey==='','k')+ALLKEYS.filter(function(k){return ks[k]}).map(function(k){return chip(k,k,fKey===k,'k')}).join('');
  $('cChips').innerHTML=chip('','모든 분류',fCat==='','c')+CATS.map(function(c){return chip(c.n,c.n,fCat===c.n,'c')}).join('');
  var ql=q.trim().toLowerCase();
  var l=songs.filter(function(s){return(!fKey||s.key===fKey)&&(!fCat||s.cats.indexOf(fCat)>-1)&&(!ql||(s.title+' '+s.lyric).toLowerCase().indexOf(ql)>-1)});
  $('sList').innerHTML=l.length?'<div class="list">'+l.map(function(s){return '<div class="row" data-s="'+s.id+'"><div class="kb">'+esc(s.key)+'</div><div class="rm"><div class="rt">'+esc(s.title)+'</div><div class="rl">'+(s.lyric?esc(s.lyric):'가사 한 줄을 적어두면 찾기 쉬워요')+'</div></div>'+(s.imgs.length?'<div class="ri">'+ic('img')+s.imgs.length+'</div>':'')+'</div>'}).join('')+'</div>':'<div class="empty">'+(songs.length?'조건에 맞는 곡이 없어요.':'아직 등록된 곡이 없어요.')+'</div>';
}
function updSheets(){
  var cnt={};sheets.forEach(function(s){cnt[s.key]=(cnt[s.key]||0)+1});
  $('shChips').innerHTML=chip('','전체 '+sheets.length,shKey==='','h')+ALLKEYS.filter(function(k){return cnt[k]}).map(function(k){return chip(k,k+' '+cnt[k],shKey===k,'h')}).join('');
  var h='';
  ALLKEYS.forEach(function(k){if(shKey&&shKey!==k)return;var g=sheets.filter(function(s){return s.key===k});if(!g.length)return;
    h+='<div class="kh"><span class="kb sm">'+esc(k)+'</span><span class="sub">'+g.length+'개</span></div><div class="sg">'+g.map(function(s){return '<div class="sc" data-h="'+s.id+'"><img src="'+esc(s.imgs[0]||'')+'" alt=""><div class="st">'+esc(s.title||'제목 없음')+'</div><div class="sub">'+s.imgs.length+'장</div></div>'}).join('')+'</div>'});
  $('shList').innerHTML=h||'<div class="empty">보관된 악보가 없어요.</div>';
}

/* ---------- 데이터 구독 ---------- */
function startSubs(){
  db.collection('songs').orderBy('at','desc').onSnapshot(function(s){songs=(s.docs||[]).map(function(d){var x=d.data();return{id:d.id,title:x.title||'',lyric:x.lyric||'',yt:x.yt||'',key:x.key||'C',cats:x.cats||[],imgs:x.imgs||[],at:x.at||0}});render();pkDraw()},function(){toast('곡 목록을 불러오지 못했어요')});
  db.collection('sheets').orderBy('at','desc').onSnapshot(function(s){sheets=(s.docs||[]).map(function(d){var x=d.data();return{id:d.id,title:x.title||'',key:x.key||'C',imgs:x.imgs||[],at:x.at||0}});render();pkDraw()},function(){});
  db.collection('contis').orderBy('at','desc').onSnapshot(function(s){contis=(s.docs||[]).map(function(d){var x=d.data();return{id:d.id,name:x.name||'',date:x.date||'',topic:x.topic||'',songs:x.songs||[],pages:x.pages||[],at:x.at||0}});render()},function(){});
  db.collection('members').onSnapshot(function(s){members=mapDocs(s);render()},function(){});
  db.doc('requests/'+myId).onSnapshot(function(s){myReq=s.exists?s.data():null;render()},function(){});
  db.doc('settings/cats').onSnapshot(function(s){var d=s.exists?s.data():null,l=d&&d.list;if(l&&l.length)CATS=l.filter(function(c){return c&&typeof c.n==='string'&&typeof c.c==='string'});if(fCat&&!CATS.some(function(c){return c.n===fCat}))fCat='';render();drawSong()},function(){});
  db.doc('settings/team').onSnapshot(function(s){var d=s.exists?s.data():null;if(d&&d.name)teamName=d.name;render()},function(){});
  if(isOwner)db.collection('requests').onSnapshot(function(s){requests=mapDocs(s);render()},function(){});
}
function mapDocs(snap){var o={};(snap.docs||[]).forEach(function(d){o[d.id]=d.data()});return o}
function saveCats(l){return db.doc('settings/cats').set({list:l}).catch(function(){toast('저장 권한이 없거나 오류가 났어요')})}
function addCat(n){n=(n||'').trim();if(!n){toast('분류 이름을 입력해 주세요');return Promise.resolve(false)}
  if(CATS.some(function(c){return c.n===n})){toast('이미 있는 분류예요');return Promise.resolve(false)}
  return saveCats(CATS.concat([{n:n,c:PAL[CATS.length%PAL.length]}])).then(function(){return true})}

$('main').onclick=function(e){
  var el=e.target.closest('[data-sub],[data-g],[data-s],[data-h],[data-c],[data-act],[data-ok],[data-no],[data-rm],[data-cd]');if(!el)return;
  var d=el.dataset;
  if(d.sub){sub=d.sub;render();return}
  if(d.g!==undefined){if(d.g==='k')fKey=d.v;else if(d.g==='c')fCat=d.v;else shKey=d.v;render();return}
  if(d.s){openView('s',d.s);return}

  if(d.no){db.doc('requests/'+d.no).delete().catch(function(){toast('처리하지 못했어요')});return}
  if(d.rm){db.doc('members/'+d.rm).delete().catch(function(){toast('처리하지 못했어요')});return}
  if(d.cd!==undefined){var i=+d.cd;if(cmArm===i){cmArm=null;saveCats(CATS.filter(function(c,j){return j!==i}))}else{cmArm=i;render();setTimeout(function(){if(cmArm===i){cmArm=null;render()}},3000)}return}
  var a=d.act;
  if(a==='newConti')openConti();
  if(a==='req'){var n=$('rName').value.trim();if(!n){toast('이름을 입력해 주세요');return}
    db.doc('requests/'+myId).set({note:n,memo:($('rMemo').value||'').trim(),email:myEmail,at:Date.now()}).then(function(){toast('요청을 보냈어요')},function(){toast('요청을 보내지 못했어요')})}
  if(a==='teamSave'){var t=$('tmName').value.trim();if(t)db.doc('settings/team').set({name:t}).then(function(){toast('저장했어요')},function(){toast('저장하지 못했어요')})}
  if(a==='catAdd')addCat($('cmName').value).then(function(ok){if(ok)toast('분류를 추가했어요')});
  if(a==='copy'){var i2=$('shLink');i2.focus();i2.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}
    if(ok)toast('링크를 복사했어요');else if(navigator.clipboard)navigator.clipboard.writeText(i2.value).then(function(){toast('링크를 복사했어요')},function(){toast('링크를 길게 눌러 복사해 주세요')});else toast('링크를 길게 눌러 복사해 주세요')}
  if(a==='imp')importLocal();
  if(a==='logout')doLogout();
};

/* ---------- 키 선택기 ---------- */
var KS={song:{minor:false,base:'C'},sheet:{minor:false,base:'C'}};
function kpInit(id,host){$(host).innerHTML='<div class="seg" data-kp="'+id+'"><button data-m="0">장조</button><button data-m="1">단조</button></div><div class="kgrid" data-kg="'+id+'">'+KEYS.map(function(k){return '<button data-k="'+k+'">'+k+'</button>'}).join('')+'</div>'}
function kpDraw(id){var s=KS[id],h=document.querySelector('[data-kp="'+id+'"]');
  h.children[0].className=s.minor?'':'on';h.children[1].className=s.minor?'on':'';
  Array.prototype.forEach.call(document.querySelector('[data-kg="'+id+'"]').children,function(b){b.className=b.getAttribute('data-k')===s.base?'on':''})}
function kpVal(id){return KS[id].base+(KS[id].minor?'m':'')}
function kpSet(id,key){KS[id]={minor:/m$/.test(key),base:key.replace(/m$/,'')};kpDraw(id)}
kpInit('song','kpSong');kpInit('sheet','kpSheet');kpDraw('song');kpDraw('sheet');
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-kp] button');if(m){var id=m.parentNode.getAttribute('data-kp');KS[id].minor=m.getAttribute('data-m')==='1';kpDraw(id);return}
  var k=e.target.closest('[data-kg] button');if(k){var id2=k.parentNode.getAttribute('data-kg');KS[id2].base=k.getAttribute('data-k');kpDraw(id2)}});

/* ---------- 이미지 업로드 ---------- */
function shrink(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var w=Math.min(1400,im.width),h=im.height*w/im.width,c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  c.toBlob(function(b){res(b)},'image/jpeg',.75)};im.onerror=function(){res(null)};im.src=r.result};r.onerror=function(){res(null)};r.readAsDataURL(file)})}
function uploadFiles(files,arr,done){
  if(!assets){toast('이 계정에서는 악보 업로드를 사용할 수 없어요');return}
  toast('악보 올리는 중…');
  Promise.all(Array.prototype.map.call(files,function(f){return shrink(f).then(function(b){return b?assets.upload(b):null}).catch(function(){return null})}))
  .then(function(a){a.forEach(function(r){if(r&&r.url)arr.push(r.url)});done()})}
function thumbsHTML(arr){return arr.map(function(d,i){return '<div><img src="'+esc(d)+'" alt="악보 '+(i+1)+'"><b data-i="'+i+'">×</b></div>'}).join('')}

/* ---------- 곡 등록 ---------- */
var editId=null,fCats=[],fImgs=[],ncOpen=false;
function drawSong(){
  $('fCats').innerHTML=CATS.map(function(c){return '<button type="button" class="chip'+(fCats.indexOf(c.n)>-1?' on':'')+'" data-fc="'+esc(c.n)+'">'+esc(c.n)+'</button>'}).join('')+'<button type="button" class="chip dash" id="ncBtn">＋ 새 분류</button>';
  $('newCat').style.display=ncOpen?'flex':'none';
  $('fThumbs').innerHTML=thumbsHTML(fImgs)}
function openSong(id){
  editId=id||null;var s=songs.filter(function(x){return x.id===id})[0];
  $('psT').textContent=s?'곡 수정':'곡 등록';
  $('fTitle').value=s?s.title:'';$('fLyric').value=s?s.lyric:'';$('fYt').value=s?s.yt:'';$('fFile').value='';
  kpSet('song',s?s.key:'C');fCats=s?s.cats.slice():[];fImgs=s?s.imgs.slice():[];ncOpen=false;
  drawSong();$('pgSong').classList.add('show')}
$('fCats').onclick=function(e){
  if(e.target.id==='ncBtn'){ncOpen=!ncOpen;drawSong();return}
  var c=e.target.getAttribute('data-fc');if(!c)return;var i=fCats.indexOf(c);i>-1?fCats.splice(i,1):fCats.push(c);drawSong()};
$('ncAdd').onclick=function(){var n=$('ncName').value.trim();addCat(n).then(function(ok){if(ok){fCats.push(n);$('ncName').value='';ncOpen=false;drawSong()}})};
$('fThumbs').onclick=function(e){var i=e.target.getAttribute('data-i');if(i!==null){fImgs.splice(+i,1);drawSong()}};
$('fFile').onchange=function(e){uploadFiles(e.target.files,fImgs,function(){e.target.value='';drawSong()})};
$('sgSave').onclick=function(){
  var t=$('fTitle').value.trim();if(!t){toast('곡 제목을 입력해 주세요');return}
  var id=editId||String(Date.now()),old=songs.filter(function(x){return x.id===id})[0];
  db.doc('songs/'+id).set({title:t,lyric:$('fLyric').value.trim(),yt:$('fYt').value.trim(),key:kpVal('song'),cats:fCats.slice(),imgs:fImgs.slice(),at:old?old.at:Date.now()})
  .then(function(){$('pgSong').classList.remove('show');toast('저장했어요')},function(){toast('저장 권한이 없거나 오류가 났어요')})};

$('shFile').onchange=function(e){uploadFiles(e.target.files,shImgs,function(){e.target.value='';$('shThumbs').innerHTML=thumbsHTML(shImgs)})};

/* ---------- 상세 보기 ---------- */
var V={kind:'',id:'',imgs:[],title:'',raw:'',key:null};
function getObj(k,id){return k==='s'?songs.filter(function(x){return x.id===id})[0]:k==='h'?sheets.filter(function(x){return x.id===id})[0]:contis.filter(function(x){return x.id===id})[0]}
function openView(kind,id){var o=getObj(kind,id);if(!o)return;V.kind=kind;V.id=id;vArm=false;
  if(kind==='c'){V.imgs=o.pages;V.raw=o.name;V.title=o.name;V.key=null}
  else{V.imgs=o.imgs;V.raw=o.title||'악보';V.key=o.key;V.title=V.raw+' '+o.key}
  drawView();$('pgView').classList.add('show');$('vB').scrollTop=0}
function drawView(){
  var o=getObj(V.kind,V.id);if(!o){$('pgView').classList.remove('show');return}
  var w=canWrite(),h='';$('vT').textContent=V.raw;
  if(V.kind==='s'){var yt=safeUrl(o.yt);
    h+='<div class="vi"><span class="kb sm">'+esc(o.key)+'</span><div class="rm"><div class="rt" style="white-space:normal">'+esc(o.title)+'</div>'+(o.lyric?'<div class="rl" style="white-space:normal">“'+esc(o.lyric)+'”</div>':'')+'</div></div>'+
    (o.cats.length?'<div class="tags">'+o.cats.map(function(c){return '<span class="tag" style="background:'+catColor(c)+'">'+esc(c)+'</span>'}).join('')+'</div>':'');

function createSbDb(client){
  function makeSnap(rows){
    return {docs:rows.map(function(r){return{id:r.id,data:function(){return r.data||{}}}})};
  }
  return {
    collection:function(colName){
      var ordCol=null,ordAsc=true;
      var qObj={
        orderBy:function(f,dir){ordCol=f;ordAsc=dir!=='desc';return qObj},
        onSnapshot:function(cb,errCb){
          async function load(){
            var query=client.from('kv_docs').select('*').eq('col',colName);
            if(ordCol==='at')query=query.order('at',{ascending:ordAsc});
            var res=await query;
            if(res.error){if(errCb)errCb(res.error);return}
            cb(makeSnap(res.data||[]));
          }
          load();
          client.channel('col_'+colName+'_'+Math.random())
            .on('postgres_changes',{event:'*',schema:'public',table:'kv_docs',filter:'col=eq.'+colName},load)
            .subscribe();
        }
      };
      return qObj;
    },
    doc:function(path){
      var parts=path.split('/'),colName=parts[0],docId=parts[1];
      return {
        onSnapshot:function(cb,errCb){
          async function load(){
            var res=await client.from('kv_docs').select('*').eq('col',colName).eq('id',docId).maybeSingle();
            if(res.error){if(errCb)errCb(res.error);return}
            cb({exists:!!res.data,data:function(){return res.data?res.data.data:null}});
          }
          load();
          client.channel('doc_'+colName+'_'+docId+'_'+Math.random())
            .on('postgres_changes',{event:'*',schema:'public',table:'kv_docs',filter:'col=eq.'+colName},load)
            .subscribe();
        },
        set:async function(obj){
          var res=await client.from('kv_docs').upsert({col:colName,id:docId,data:obj,at:obj.at||Date.now()});
          if(res.error)throw res.error;
        },
        delete:async function(){
          var res=await client.from('kv_docs').delete().eq('col',colName).eq('id',docId);
          if(res.error)throw res.error;
        }
      };
    }
  };
}

(async function(){
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var sessRes=await sb.auth.getSession();
  var u=sessRes.data&&sessRes.data.session&&sessRes.data.session.user;
  if(!u){needCfg=true;ready=true;render();return}
  myId=u.id;
  myEmail=u.email||'';
  isOwner=myEmail.toLowerCase()===OWNER_EMAIL.toLowerCase();
  db=createSbDb(sb);
  assets={
    upload:async function(blob){
      var path=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
      var up=await sb.storage.from('sheets').upload(path,blob,{contentType:'image/jpeg',upsert:false});
      if(up.error)throw up.error;
      return {url:sb.storage.from('sheets').getPublicUrl(path).data.publicUrl};
    }
  };
  downloads={
    save:async function(opts){
      var u2=URL.createObjectURL(opts.data),a=document.createElement('a');
      a.href=u2;a.download=opts.filename||'download';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u2)},1000);
    }
  };
  ready=true;
  startSubs();
  render();
})();
</script>
