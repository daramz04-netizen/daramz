<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찬양 곡 노트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f5f3;--card:#fff;--ink:#1c1d1f;--sub:#7a7d82;--line:#e8e8e5;--acc:#1c1d1f;--accInk:#fff;--chip:#efefec;--ind:#3b3bb0;--indBg:#ecedfb;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1e2022;--ink:#eeeeec;--sub:#9a9ea4;--line:#2d3033;--acc:#eeeeec;--accInk:#141516;--chip:#2a2c2f;--ind:#a9abf5;--indBg:#2a2b49;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--card:#1e2022;--ink:#eeeeec;--sub:#9a9ea4;--line:#2d3033;--acc:#eeeeec;--accInk:#141516;--chip:#2a2c2f;--ind:#a9abf5;--indBg:#2a2b49;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:680px;margin:0 auto;padding:18px 16px 150px}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 16px}
.hd h1{font-size:1.7rem;margin:0;letter-spacing:-.03em}
.sub{color:var(--sub);font-size:.9rem}
.ic{width:22px;height:22px;flex:none}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 16px;margin-bottom:12px;color:var(--sub)}
.search input{flex:1;border:0;background:none;outline:none;padding:15px 0;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:600}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.chip.dash{border-style:dashed;color:var(--ind);background:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.kb{flex:none;width:58px;height:58px;border-radius:16px;background:var(--indBg);color:var(--ind);font-weight:800;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.kb.sm{width:46px;height:46px;font-size:1rem;border-radius:13px}
.rm{flex:1;min-width:0}
.rt{font-weight:700;font-size:1.08rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl{color:var(--sub);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri{flex:none;display:flex;align-items:center;gap:4px;color:var(--sub)}
.ri .ic{width:20px;height:20px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.empty2{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px;gap:6px}
.empty2 .eic{width:84px;height:84px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty2 h3{margin:0;font-size:1.15rem}.empty2 p{margin:0 0 16px;color:var(--sub)}
.btn{background:var(--acc);color:var(--accInk);border:1px solid var(--acc);border-radius:14px;padding:12px 22px;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:11px}
.btn.full{width:100%}
.btn.danger{color:var(--red)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accInk);border:0;border-radius:999px;padding:16px 24px;font-weight:700;font-size:1.02rem;display:none;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:30}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:.8rem;font-weight:600}
.tabs button.on{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:.92rem;color:var(--sub);font-weight:600}
.card .big{font-size:1.2rem;font-weight:800;margin-bottom:6px}
.card p{margin:6px 0 10px}
label{display:block;font-weight:700;margin:14px 0 6px}
label i{color:#c0392b;font-style:normal}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;margin-bottom:8px}
textarea.fld{resize:vertical;min-height:110px}
.fld:focus{border-color:var(--sub)}
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kgrid button{padding:13px 0;border:1px solid var(--line);background:var(--card);border-radius:14px;font-weight:700}
.kgrid button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:.78rem;padding:3px 10px;border-radius:999px;color:#2b2b2b;font-weight:600}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative}
.thumbs img{height:84px;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs b{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:.8rem;cursor:pointer}
.page{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
.page.show{display:flex}
.ph{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;flex:none}
.ph h2{margin:0;font-size:1.1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk{border:0;background:none;padding:8px;display:flex}
.pb{flex:1;overflow-y:auto;padding:8px 16px 24px;max-width:680px;width:100%;margin:0 auto}
.pf{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}
.pf .btn{flex:1}
.pf .btn:last-child{flex:1.4}
.vbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.vimgs img{width:100%;border-radius:12px;margin-bottom:10px;background:#fff;border:1px solid var(--line)}
.vi{display:flex;gap:12px;align-items:center}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.sc img{width:100%;height:140px;object-fit:cover;object-position:top;border-radius:9px;background:#fff;border:1px solid var(--line);display:block}
.st{font-weight:700;font-size:.88rem;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kh{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow small{color:var(--sub);display:block}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.on>.num,.crow .num{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.mv{display:flex;gap:4px}
.mv button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px}
.sfb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sfb input{width:90px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--card)}
.sfprev{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.sfprev canvas{width:100%;display:block}
#gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
.gt{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:10px}
.gt .gi{font-size:2.6rem}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:10px 18px;border-radius:12px;display:none;z-index:200;font-size:.92rem;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="hd"><h1 id="tName">찬양 곡 노트</h1><span class="sub" id="hCount"></span></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab"></button>
<nav class="tabs" id="tabs"></nav>

<div class="page" id="pgSong"><div class="ph"><button class="bk" data-close="pgSong" id="bkSong"></button><h2 id="psT">곡 등록</h2></div>
 <div class="pb">
  <div class="card"><h3>기본 정보</h3>
   <label style="margin-top:0">곡 제목 <i>*</i></label><input class="fld" id="fTitle" placeholder="곡 제목">
   <label>가사 한 줄</label><input class="fld" id="fLyric" maxlength="80" placeholder="목록에서 곡을 알아볼 대표 가사">
   <label>음원 유튜브 링크</label><input class="fld" id="fYt
